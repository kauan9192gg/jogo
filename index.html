</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<p>WASD/setas: mover · Espaço: atacar · Q: esquivar · Shift: andar devagar · Clique direito: arremessar pedra · E: interagir · 1–9: item · I/Tab: mochila · P: pausa · M: som · F: lanterna</p>

<!-- BOTÕES MOBILE -->
<style>

.tb{width:64px;height:64px;border-radius:50%;background:rgba(200,50,50,.45);border:2px solid rgba(255,255,255,.4);color:#fff;font:bold 13px Arial;align-items:center;justify-content:center}
.tb:active{background:rgba(255,224,102,.7);color:#000}
</style>
<div id="joy" class="tc"><div id="knob"></div></div>
<div id="bAtk" class="tc tb" style="right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(60px + env(safe-area-inset-bottom,0px));width:84px;height:84px">ATACAR</div>
<div id="bEsq" class="tc tb" style="right:116px;bottom:calc(30px + env(safe-area-inset-bottom,0px))">ESQUIVA</div>
<div id="bInt" class="tc tb" style="right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(160px + env(safe-area-inset-bottom,0px))">E</div>
<div id="bPed" class="tc tb" style="right:100px;bottom:calc(112px + env(safe-area-inset-bottom,0px))">PEDRA</div>
<div id="bBag" class="tc tb" style="right:calc(20px + env(safe-area-inset-right,0px));top:calc(240px + env(safe-area-inset-top,0px));width:48px;height:48px">🎒</div>
<div id="bPau" class="tc tb" style="left:calc(14px + env(safe-area-inset-left,0px));top:calc(240px + env(safe-area-inset-top,0px));width:48px;height:48px">⏸</div>
<div id="bLan" class="tc tb" style="left:calc(70px + env(safe-area-inset-left,0px));top:calc(240px + env(safe-area-inset-top,0px));width:48px;height:48px">🔦</div>

<script>
const W=1280,H=720,T=64,MW=50,MH=40,CAM_OFF=200;
const cv=document.getElementById('c'),g=cv.getContext('2d');
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pick=a=>a[Math.floor(Math.random()*a.length)];
const TEL=[[150,80,70],[80,100,120],[130,130,130],[100,120,90],[120,90,110]];
const PAR=[[210,200,190],[190,190,200],[200,190,170],[180,200,190],[200,180,160],[170,185,175]];
const POR=[[110,80,60],[80,60,50],[150,100,70],[60,80,100],[90,70,55],[100,60,70]];
const rgb=(c,d=0)=>`rgb(${Math.max(0,c[0]-d)},${Math.max(0,c[1]-d)},${Math.max(0,c[2]-d)})`;
const R=(c,x,y,w,h)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
const RR=(c,x,y,w,h,r)=>{g.fillStyle=c;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()};
const C=(c,x,y,r)=>{g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill()};
const E=(x,y,w,h)=>{g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,7);g.fill()};

let mapa,carros,arvores,casas,world,estado='menu',cam,keys={},mouse={x:W/2,y:H/2,down:false,rDown:false};
let DEC=[],LAM=[],CON=[],MM,hov=null,hovCar=null,hovFurn=null,TR={},SH=0,AC,jaViu=false;
let menuSel=0,menuOpts=['Novo Jogo','Continuar'];
let temSave=false;

/* ===== SAVE ===== */
const SAVE_KEY='apocalipse25d_save_v3';
function temSaveDisponivel(){try{return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;}}
function salvarCheckpoint(){
  if(!world)return;
  const j=world.j;
  const save={
    q:world.q,onda:world.onda,mortes:world.mortes,base:world.base||0,def:world.def||0,
    carMunUsed:world.carMunUsed||0,
    vida:j.vida,vidaMax:j.vidaMax,fome:j.fome,sede:j.sede,stam:j.stam,
    pedras:j.pedras||0,inv:JSON.parse(JSON.stringify(j.inv)),arma:j.arma,dur:j.dur,cans:!!j.cans,
    bastaoOk:world.bastaoOk||false,pistolaOk:world.pistolaOk||false,
    pegou:Object.assign({},world.pegou||{}),
    itens:world.itens.map(it=>({x:it.x,y:it.y,t:it.tipo,e:it.esp||false})),
    zs:world.zs.map(z=>({x:z.x,y:z.y,v:z.vida,vv:z.vidaMax,vel:z.vel,dano:z.dano,b:z.bruto||0,st:z.st,tx:z.tx,ty:z.ty,tmr:z.tmr,k:z.kind||'',g:z.gritou?1:0})),
    TR:Object.assign({},TR),ts:Date.now()
  };
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));temSave=true;}catch(e){console.warn('save fail',e);}
}
function carregarSave(){try{const s=localStorage.getItem(SAVE_KEY);if(!s)return null;return JSON.parse(s);}catch(e){return null;}}
function apagarSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}temSave=false;}
function aplicarSave(sv){
  if(!sv)return false;
  genMap();
  world=new Mundo(0,0);
  estado='jogando';cam={x:0,y:0};jaViu=true;
  world.carMunUsed=sv.carMunUsed||0;
  interiores();
  const c=casas[0],j=world.j;
  const x0=c.x+1,x1=c.x+c.w-2,y0=c.y+1,y1=c.y+c.h-2,dc=c.x+(c.w>>1);
  j.x=dc*T+T/2;j.y=y1*T+T/2;j.dir=[0,-1];j.aim=[0,-1];
  j.vida=sv.vida!=null?sv.vida:j.vidaMax;
  j.vidaMax=sv.vidaMax||100;
  j.fome=sv.fome!=null?sv.fome:100;
  j.sede=sv.sede!=null?sv.sede:100;
  j.stam=sv.stam!=null?sv.stam:100;
  j.pedras=sv.pedras||0;
  j.inv=Object.assign({},sv.inv||{});
  j.cans=!!sv.cans;
  j.cd=0;j.wind=null;j.cur=0;j.esqCd=0;j.inv_t=0;j.abrir=null;j.mov=false;
  j.arma='Punhos';j.dano=10;j.alcance=50;j.dur=sv.dur||40;
  if(sv.arma&&sv.arma!='Punhos'&&(j.inv[sv.arma]||0)>0){equipar(sv.arma);}
  world.q=sv.q||0;world.onda=sv.onda||0;world.mortes=sv.mortes||0;
  world.base=sv.base||0;world.def=sv.def||0;
  world.bastaoOk=!!sv.bastaoOk;world.pistolaOk=!!sv.pistolaOk;
  world.pegou=Object.assign({},sv.pegou||{});
  world.itens=(sv.itens||[]).map(o=>{const it=new Item(o.x,o.y,o.t);if(o.e)it.esp=true;return it;});
  world.zs=(sv.zs||[]).map(o=>{
    const z=new Zumbi(o.x,o.y);
    z.vida=o.v;z.vidaMax=o.vv;z.vel=o.vel;z.dano=o.dano;
    if(o.b){z.bruto=1;z.raio=18;z.cor='#7a5a4a';}
    z.st=o.st||'idle';z.tx=o.tx;z.ty=o.ty;z.tmr=o.tmr||0;
    if(o.k){applyKind(z,o.k,true);if(o.g)z.gritou=1;}
    return z;
  });
  world.zs=world.zs.filter(z=>Math.hypot(z.x-j.x,z.y-j.y)>260);
  TR=Object.assign({},sv.TR||{});
  cam.x=j.x-W/2;cam.y=j.y-H/2+CAM_OFF;
  mkMini();
  world.msg('✔ Checkpoint: '+(OBJ[world.q]?OBJ[world.q].t:'—'),'#9aff9a');
  return true;
}

const BAL={
  player:{vida:100,fome:100,sede:100,vel:1.6,lento:.9,corre:3.8,drenoStam:.55,regenAndando:.18,regenParado:.4},
  ruido:{parado:20,lento:60,andando:180,correndo:480,tiro:900,ataque:300,vasculhar:170,casaFator:0.35},
  ruidoAcum:{decay:0.5,limiar:800,janela:360,cooldown:1800,hordaMin:4,hordaMax:8},
  zumbi:{tmrChase:540,search:180,separa:0.6},
  combate:{
    Punhos:{dano:10,alcance:50,wind:8,recovery:20,stam:8},
    'Bastão':{dano:18,alcance:70,wind:6,recovery:30,stam:14,usos:40},
    Pistola:{dano:25,alcance:340,wind:5,recovery:24,stam:0,headshot:2},
    dotMin:0.5
  },
  esquiva:{iframe:18,stam:12,cd:60,dist:90},
  pedra:{max:6,dano:12,stun:20}
};

function genMap(){
  mapa=Array.from({length:MH},()=>Array(MW).fill(0));carros=[];arvores=[];casas=[];
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(y%10<2||x%10<2)mapa[y][x]=1;
    else if(y%10==2||y%10==9||x%10==2||x%10==9)mapa[y][x]=5;
  }
  const HQ=[
    [0,0,7,6,0,0,1,230,'daniel'],[1,0,6,5,1,1,0,200,'armazem'],[2,0,7,7,2,2,2,250,'igreja'],[3,0,6,6,3,3,3,210],[4,0,7,5,0,4,1,190,'estacao'],
    [0,1,6,7,1,2,2,240],[1,1,7,6,2,1,3,220],[3,1,7,6,3,0,0,230,'radio'],[4,1,6,5,0,3,1,200],
    [0,2,7,6,1,4,2,240,'posto'],[1,2,6,6,2,0,0,210],[2,2,7,5,3,1,3,200],[3,2,6,7,0,2,1,250],[4,2,7,6,1,3,2,220],
    [0,3,6,5,2,4,0,190],[1,3,7,7,3,0,3,250],[2,3,6,6,0,1,1,210,'delegacia'],[3,3,7,6,1,2,2,230]
  ];
  HQ.forEach((h,i)=>{
    const [bx,by,w,hh,pi,ti,qi,Hh,tag]=h,cx=3+bx*10,cy=3+by*10;
    casas.push({x:cx,y:cy,w,h:hh,par:PAR[pi],tel:TEL[ti],por:POR[qi],H:Hh,tag,est:(i*3+1)%4});
    for(let a=0;a<w;a++)for(let b=0;b<hh;b++)mapa[cy+b][cx+a]=(a==0||b==0||a==w-1||b==hh-1)?2:4;
    mapa[cy+hh-1][cx+(w>>1)]=3;
    if(i%2==0)arvores.push([cx-1,cy+2]);
    if(i%3==0)arvores.push([cx+1,cy-1]);
  });
  const ocupado=(cx,cy,w,h)=>{for(const c of casas)if(cx<c.x+c.w&&cx+w>c.x&&cy<c.y+c.h&&cy+h>c.y)return true;return false;};
  const tentarCasa=(cx,cy,w,hh)=>{
    if(cx<3||cy<3||cx+w>MW-3||cy+hh>MH-3)return false;
    if(ocupado(cx,cy,w,hh))return false;
    for(let a=0;a<w;a++)for(let b=0;b<hh;b++){const t=mapa[cy+b][cx+a];if(t==1||t==5)return false;}
    return true;
  };
  for(let gy=0;gy<4;gy++)for(let gx=0;gx<5;gx++){
    if(gx==0&&gy==0)continue;
    const baseX=3+gx*10,baseY=3+gy*10;
    let temCasa=false;
    for(const c of casas)if(c.x>=baseX-1&&c.x<=baseX+9&&c.y>=baseY-1&&c.y<=baseY+9){temCasa=true;break;}
    if(temCasa)continue;
    const nC=rnd(1,2);
    for(let k=0;k<nC;k++){
      const w=rnd(4,6),hh=rnd(4,6);
      const cx=baseX+rnd(0,9-w),cy=baseY+rnd(0,9-hh);
      if(tentarCasa(cx,cy,w,hh)){
        const estilo=rnd(0,5);
        const doorLateral=Math.random()<.5;
        const doorX=cx+(doorLateral?rnd(1,w-2):(w>>1));
        const par=PAR[estilo%PAR.length],tel=TEL[rnd(0,TEL.length-1)],por=POR[rnd(0,POR.length-1)];
        const Hh=rnd(170,270);
        casas.push({x:cx,y:cy,w,h:hh,par,tel,por,H:Hh,tag:null,est:estilo,doorX});
        for(let a=0;a<w;a++)for(let b=0;b<hh;b++)mapa[cy+b][cx+a]=(a==0||b==0||a==w-1||b==hh-1)?2:4;
        mapa[cy+hh-1][doorX]=3;
        if(Math.random()<.5)arvores.push([cx-1,cy+rnd(1,hh-2)]);
        if(Math.random()<.3)arvores.push([cx+w,cy+rnd(0,hh-1)]);
      }
    }
  }
  for(let y=33;y<39;y++)for(let x=43;x<49;x++)mapa[y][x]=2;
  const CARS=[[5,1],[17,1],[26,0],[38,1],[45,0],[3,10],[14,11],[24,10],[35,11],[8,20],[19,21],[29,20],[44,21],[12,30],[22,31],[33,30],[46,31],[1,6],[0,15],[1,26],[11,7],[10,17],[11,27],[20,5],[21,14],[20,25],[30,8],[31,18],[30,28],[40,12],[41,22],[40,33]];
  carros=CARS.map(c=>[c[0],c[1]]);
  arvores=arvores.concat([[23,13],[28,13],[23,18],[28,18],[25,13],[27,18],[22,15],[29,16]]);
  const fr=t=>{const c=casas.find(h=>h.tag==t);return[(c.x+(c.w>>1))*T+T/2,(c.y+c.h)*T+T/2];};
  const rp=fr('posto'),rr=fr('radio'),ri=fr('igreja'),rd=fr('delegacia'),re=fr('estacao');
  L_POSTO[0]=rp[0];L_POSTO[1]=rp[1];L_RADIO[0]=rr[0];L_RADIO[1]=rr[1];
  L_IGREJA[0]=ri[0];L_IGREJA[1]=ri[1];L_DELEG[0]=rd[0];L_DELEG[1]=rd[1];L_ESTACAO[0]=re[0];L_ESTACAO[1]=re[1];
  L_PRACA[0]=1664;L_PRACA[1]=1024;L_EST[0]=2656;L_EST[1]=2272;
}

const col=(tx,ty)=>{
  if(tx<0||ty<0||tx>=MW||ty>=MH)return true;
  return mapa[ty][tx]==2||mapa[ty][tx]==6||carros.some(c=>c[0]==tx&&c[1]==ty)||arvores.some(a=>a[0]==tx&&a[1]==ty);
};
const interior=(tx,ty)=>tx>=0&&ty>=0&&tx<MW&&ty<MH&&(mapa[ty][tx]==3||mapa[ty][tx]==4);
function casaDe(x,y){const tx=x/T|0,ty=y/T|0;if(tx<0||ty<0||tx>=MW||ty>=MH||mapa[ty][tx]!=4)return null;return casas.find(c=>tx>=c.x&&tx<c.x+c.w&&ty>=c.y&&ty<c.y+c.h)||null;}
function visCasa(e){const h=casaDe(e.x,e.y);return !h||h===casaDe(world.j.x,world.j.y);}

class Jogador{
  constructor(x,y){Object.assign(this,{
    x,y,raio:14,vel:1.6,vida:100,vidaMax:100,fome:100,sede:100,stam:100,dir:[0,1],aim:[0,1],
    inv:{'Bandagem':2,'Comida':1,'Água':1},arma:'Punhos',cd:0,dano:10,alcance:50,anim:0,mov:false,flash:0,
    wind:null,cur:0,ruido:20,inv_t:0,esqCd:0,esqDir:[0,0],cans:false,dur:40,abrir:null,pedras:0
  });}
  mover(dx,dy){
    this.mov=dx||dy;if(!this.mov)return;
    this.anim+=.11*this.vel/1.6;const m=Math.hypot(dx,dy);this.dir=[dx/m,dy/m];
    const nx=this.x+dx*this.vel,ny=this.y+dy*this.vel;
    if(dx&&!col(Math.floor((nx+this.raio*Math.sign(dx))/T),Math.floor(this.y/T)))this.x=nx;
    if(dy&&!col(Math.floor(this.x/T),Math.floor((ny+this.raio*Math.sign(dy))/T)))this.y=ny;
  }
  atacar(zs){
    if(this.cd>0||this.wind)return;
    const cfg=BAL.combate[this.arma]||BAL.combate.Punhos;
    if(this.arma=='Pistola'&&(this.inv['Munição']||0)<=0){this.cd=18;som(220,.05,'square',.05);world.msg('Sem munição!','#ff9060');return;}
    if(this.arma!='Pistola'){if((this.stam??100)<cfg.stam){this.cd=20;world.msg('Sem fôlego!','#ff9060');return;}this.stam-=cfg.stam;if(this.stam<=0){this.stam=0;this.cans=true;}}
    let d=this.dir;
    if(mouse.down){const mx=mouse.x+cam.x-this.x,my=mouse.y+cam.y-this.y,m=Math.hypot(mx,my);if(m>0){d=[mx/m,my/m];this.dir=d;}}
    this.wind={t:cfg.wind,n:cfg.wind,d,cfg};
  }
  esquivar(dx,dy){
    if(this.esqCd>0||this.stam<BAL.esquiva.stam)return;
    const m=Math.hypot(dx,dy)||1;
    this.esqDir=[dx/m,dy/m];this.esqCd=BAL.esquiva.cd;this.inv_t=BAL.esquiva.iframe;
    this.stam-=BAL.esquiva.stam;if(this.stam<0)this.stam=0;
    const nx=this.x+this.esqDir[0]*BAL.esquiva.dist,ny=this.y+this.esqDir[1]*BAL.esquiva.dist;
    if(!col(Math.floor((nx+this.raio*Math.sign(this.esqDir[0]))/T),Math.floor(this.y/T)))this.x=nx;
    if(!col(Math.floor(this.x/T),Math.floor((ny+this.raio*Math.sign(this.esqDir[1]))/T)))this.y=ny;
    som(340,.15,'triangle',.06);
  }
  desenhar(){
    const px=Math.round(this.x-cam.x),py=Math.round(this.y-cam.y),d=this.dir,r=this.ruido||55;
    g.strokeStyle=r>400?'rgba(255,80,80,.35)':'rgba(255,255,255,.14)';g.lineWidth=2;
    g.beginPath();g.ellipse(px,py+11,r,r*.5,0,0,7);g.stroke();
    E(px-15,py+4,30,12);
    g.strokeStyle='#ffe066';g.lineWidth=2;g.beginPath();g.ellipse(px,py+10,19,8,0,0,7);g.stroke();
    C('rgba(255,255,255,.85)',px+d[0]*34,py+10+d[1]*17,4);
    const O=(c,x,y,w,h,rr)=>{RR('#17110d',x-1.5,y-1.5,w+3,h+3,rr+1.5);RR(c,x,y,w,h,rr);};
    const mv=this.mov,s=Math.sin(this.anim*2),p=mv?-Math.abs(s)*1.6:Math.sin(Date.now()/700)*.7,fr=Math.abs(d[1])>=Math.abs(d[0]),back=fr&&d[1]<0,sg=d[0]>=0?1:-1;
    const SK='#d2a47c',SKD='#b98a63',HR='#2b1b12',SH='#e8821e',SHD='#c4690f',JN='#34507f',BT='#2a1f18',BP='#42553f',w3=mv?s*3.5:0,w5=mv?s*6:0,hy=py-35+p;
    if(this.inv_t>0){g.globalAlpha=.55;}
    if(fr){O(JN,px-8,py-5+w3,7,15,2);O(JN,px+1,py-5-w3,7,15,2);O(BT,px-9,py+7+w3,9,5,2);O(BT,px,py+7-w3,9,5,2);}
    else{O(JN,px-3+w5,py-5,7,15,2);O(JN,px-3-w5,py-5,7,15,2);O(BT,px-3+w5+(sg>0?2:-2),py+7,10,5,2);O(BT,px-3-w5+(sg>0?2:-2),py+7,10,5,2);}
    if(!fr)O(BP,px-sg*14-6,py-23+p,12,19,4);
    const tw=fr?22:15,tx=px-tw/2;O(SH,tx,py-24+p,tw,22,6);

function golpe(z,dano,d,kb){
  z.vida-=dano;z.fl=6;z.stun=z.bruto?4:14;const f=z.bruto?.35:1;
  z.kb=8;z.kx=d[0]*kb*f;z.ky=d[1]*kb*f;
  fx.sangue(z.x,z.y-10,7);fx.t.push({x:z.x,y:z.y-48,t:'-'+dano,c:'#ffd0d0',l:40});shake(3);som(120,.1,'square',.1);
  if(z.st!='chase'){z.st='chase';z.tx=world.j.x;z.ty=world.j.y;z.tmr=BAL.zumbi.tmrChase;}
  const J=world.j;
  if(J.arma=='Bastão'){J.dur=(J.dur==undefined?40:J.dur)-1;
    if(J.dur<=0){J.inv['Bastão']=Math.max(0,(J.inv['Bastão']||0)-1);J.dur=40;
      if(!J.inv['Bastão']){equipar('Punhos');world.msg('O bastão quebrou!','#ff6060');shake(6);}}}
}
function golpeTick(){
  const j=world.j,w=j.wind;if(!w||--w.t>0)return;
  j.wind=null;const d=w.d,zs=world.zs;j.aim=d;
  const cfg=w.cfg||BAL.combate[j.arma]||BAL.combate.Punhos;
  if(j.arma=='Pistola'){
    if((j.inv['Munição']||0)<=0)return;
    j.inv['Munição']--;j.cd=cfg.recovery;
    let best=null,bestHead=false,bd=1e9;
    for(const z of zs){
      const dx=z.x-j.x,dy=z.y-j.y,dist=Math.hypot(dx,dy);
      if(dist>cfg.alcance||dist<=0)continue;
      const dot=(dx*d[0]+dy*d[1])/dist;
      if(dot<BAL.combate.dotMin)continue;
      const hx=z.x,hy=z.y-32;
      const ddx=hx-j.x,ddy=hy-j.y,ddist=Math.hypot(ddx,ddy)||1;
      const hdot=(ddx*d[0]+ddy*d[1])/ddist;
      if(hdot>0.85&&Math.hypot(hx-(j.x+d[0]*ddist),hy-(j.y+d[1]*ddist))<16){
        if(best===null||dist<bd){best=z;bestHead=true;bd=dist;}
      }else if(!bestHead&&dist<bd){best=z;bd=dist;}
    }
    const ex=best?best.x:j.x+d[0]*cfg.alcance,ey=best?best.y:j.y+d[1]*cfg.alcance;
    fx.tr.push({a:j.x,b:j.y-14,c:ex,d:ey-14,l:6});
    fx.p.push({x:j.x,y:j.y-14,z:12,vx:-d[1]*2,vy:d[0]*2,vz:3,l:40,c:'#d4a63a',s:3});
    som(90,.2,'sawtooth',.22);shake(5);
    if(best){const dano=bestHead?j.dano*BAL.combate.Pistola.headshot:j.dano;golpe(best,dano,d,5);if(bestHead)fx.t.push({x:best.x,y:best.y-70,t:'HEADSHOT!',c:'#ff6060',l:50});}
    world.registrarRuido(j.x,j.y,BAL.ruido.tiro);world.hordaDir=d;
  }else{
    j.cd=cfg.recovery;
    fx.a.push({x:j.x,y:j.y,r:j.alcance*.75,an:Math.atan2(d[1],d[0]),l:8});
    som(260,.08,'triangle',.05);
    for(const z of zs){
      const dx=z.x-j.x,dy=z.y-j.y,dist=Math.hypot(dx,dy);
      if(dist<j.alcance+z.raio){
        const dot=dist>0?(dx*d[0]+dy*d[1])/dist:1;
        if(dot>BAL.combate.dotMin)golpe(z,j.dano,d,j.arma=='Bastão'?11:7);
      }
    }
    world.registrarRuido(j.x,j.y,BAL.ruido.ataque);
  }
}

function calcHover(){
  hov=null;hovCar=null;hovFurn=null;
  const j=world.j,mx=mouse.x+cam.x,my=mouse.y+cam.y;let bd=34;
  for(const it of world.itens){
    const dj=Math.hypot(it.x-j.x,it.y-j.y);
    if(dj>160||!visCasa(it))continue;
    const d=Math.hypot(it.x-mx,it.y-my);if(d<bd){bd=d;hov=it;}
  }
  const ch=casaDe(j.x,j.y);
  if(!hov&&ch){
    for(const f of movs(ch)){
      const fx0=(f.tx+.5)*T,fy0=(f.ty+.5)*T;
      if(Math.hypot(fx0-mx,fy0-my)<44&&Math.hypot(fx0-j.x,fy0-j.y)<110){hovFurn=f;break;}
    }
  }
  if(!hov&&!hovFurn){
    for(const c of carros){
      const cx=c[0]*T+T/2,cy=c[1]*T+T/2;
      if(Math.hypot(cx-mx,cy-my)<40&&Math.hypot(cx-j.x,cy-j.y)<130&&!TR[c[0]+','+c[1]])hovCar=c;
    }
  }
}

}

  if(window.amb)return;window.amb=1;
  try{AC=AC||new AudioContext();const o=AC.createOscillator(),f=AC.createBiquadFilter(),gn=AC.createGain();
    o.type='sawtooth';o.frequency.value=43;f.type='lowpass';f.frequency.value=120;gn.gain.value=.05;
    o.connect(f);f.connect(gn);gn.connect(AC.destination);o.start();}catch(e){}
}
function audioTick(){
  const w=world,j=w.j,t=w.t;
  if(j.mov&&t%(j.ruido>400?12:j.ruido<100?30:20)==0)som(70+Math.random()*30,.06,'triangle',j.ruido>400?.07:.035);
  if(j.mov&&j.ruido>400&&t%6==0)fx.p.push({x:j.x,y:j.y+8,z:2,vx:Math.random()*2-1,vy:Math.random()-.5,vz:.8,l:20,c:'#9a9a8a',s:3});
  const near=w.zs.filter(z=>z.st=='chase'&&Math.hypot(z.x-j.x,z.y-j.y)<450).length;
  if(near&&t%200==0)som(75+Math.random()*25,.6,'sawtooth',.06);
  if((j.vida<35||near>=3)&&t%48==0){som(52,.14,'sine',.3);setTimeout(()=>som(48,.12,'sine',.22),140);}
  if(j.abrir)w.registrarRuido(j.x,j.y,20);
  tickAbrir();
  calcHover();
}

function shake(n){SH=Math.max(SH,n);}
function shk(){if(SH>0){g.translate((Math.random()-.5)*SH,(Math.random()-.5)*SH);SH*=.84;if(SH<.3)SH=0;}}

function novoJogo(){
  apagarSave();
  genMap();
  world=new Mundo(0,0);
  estado='jogando';cam={x:0,y:0};jaViu=false;
  world.carMunUsed=0;
  iniciarFase();
  salvarCheckpoint();
  falar(LORE.intro);jaViu=true;
}
function continuarJogo(){
  const sv=carregarSave();
  if(!sv){novoJogo();return;}
  aplicarSave(sv);
}
function renascer(){
  const sv=carregarSave();
  if(!sv){novoJogo();return;}
  aplicarSave(sv);
}
function irMenu(){
  estado='menu';menuSel=0;menuOpts=['Novo Jogo','Continuar'];
  temSave=temSaveDisponivel();
}

/* =========================================================
   ADD-ON: MOBILE · PAUSA · LANTERNA · ZUMBIS ESPECIAIS · ONDAS
   ========================================================= */
const TOUCH=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
const $=id=>document.getElementById(id),key=(k,t)=>dispatchEvent(new KeyboardEvent(t||'keydown',{key:k}));
const ok=()=>typeof world!=='undefined'&&world&&estado==='jogando';
const near=r=>{let b=null,bd=r;for(const z of world.zs){const d=Math.hypot(z.x-world.j.x,z.y-world.j.y);if(d<bd){bd=d;b=z;}}return b;};

/* BOTÕES MOBILE */
if(TOUCH){
  const joy=$('joy'),knob=$('knob');let jid=null,atk=false;
  const setK=(a,b,c,d,s)=>{keys.a=a;keys.d=b;keys.w=c;keys.s=d;keys.shift=s;};
  const jm=e=>{const r=joy.getBoundingClientRect();let dx=e.clientX-r.left-65,dy=e.clientY-r.top-65;
    const m=Math.hypot(dx,dy),k=m>55?55/m:1;dx*=k;dy*=k;knob.style.left=45+dx+'px';knob.style.top=45+dy+'px';
    const vx=dx/55,vy=dy/55,mag=Math.hypot(vx,vy);setK(vx<-.35,vx>.35,vy<-.35,vy>.35,mag>.25&&mag<.6);};
  joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e);e.preventDefault();});
  joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e);});
  const rel=e=>{if(e.pointerId!==jid)return;jid=null;knob.style.left=knob.style.top='45px';setK(false,false,false,false,false);};
  joy.addEventListener('pointerup',rel);joy.addEventListener('pointercancel',rel);
  const hold=(id,dn,up)=>{const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();dn();});
    ['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>up&&up()));};
  hold('bAtk',()=>{atk=true;keys[' ']=true;},()=>{atk=false;keys[' ']=false;});
  hold('bEsq',()=>key('q'));hold('bInt',()=>key('e'));hold('bBag',()=>key('i'));hold('bPau',()=>key('p'));hold('bLan',()=>key('f'));
  hold('bPed',()=>{if(!ok())return;const z=near(420),j=world.j;
    if(z){mouse.x=z.x-cam.x;mouse.y=z.y-cam.y;}else{mouse.x=j.x-cam.x+j.dir[0]*260;mouse.y=j.y-cam.y+j.dir[1]*260;}
    arremessarPedra();});
  setInterval(()=>{if(!atk||!ok())return;const j=world.j,z=near(j.arma==='Pistola'?340:90);
    if(z){const dx=z.x-j.x,dy=z.y-j.y,m=Math.hypot(dx,dy)||1;j.dir=[dx/m,dy/m];}},40);
  setInterval(()=>{const on=typeof world!=='undefined'&&world&&(estado==='jogando'||estado==='pausa')&&!world.dlg;
    document.querySelectorAll('.tc').forEach(e=>e.style.display=on?'flex':'none');joy.style.display=on?'block':'none';},200);
}

/* PAUSA / MUDO / LANTERNA */
let lig=false,bat=100;
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(typeof world==='undefined'||!world)return;
  if(k==='p'&&!world.dlg){
    if(estado==='jogando'){estado='pausa';for(const x in keys)keys[x]=false;}
    else if(estado==='pausa')estado='jogando';
  }
  if(k==='m'&&typeof AC!=='undefined'&&AC)AC.state==='running'?AC.suspend():AC.resume();
  if(k==='f'&&estado==='jogando'&&!world.dlg){
    if(!lig&&bat<15)world.msg('Bateria fraca...','#ff9060');
    else{lig=!lig;som(lig?800:500,.05);world.msg(lig?'🔦 Lanterna ligada (+ruído)':'Lanterna desligada','#ffe9a8');}
  }
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&ok()&&!world.dlg)estado='pausa';});

/* ZUMBIS ESPECIAIS */
function applyKind(z,k,keep){
  z.kind=k;delete z.run;delete z.bruto;
  if(k==='gr'){z.cor='#c0a040';z.raio=13;if(!keep){z.vida=z.vidaMax=20;z.vel=.9;z.dano=5;}}
  else{z.cor='#7fae5a';z.raio=16;if(!keep){z.vida=z.vidaMax=45;z.vel=.55;z.dano=10;}}
}
const _za=Zumbi.prototype.atualizar;
Zumbi.prototype.atualizar=function(j){
  _za.call(this,j);
  if(this.kind==='gr'&&this.st==='chase'&&!this.gritou&&!(this.stun>0)&&world.zs.length<40){
    this.gritou=1;world.registrarRuido(this.x,this.y,BAL.ruido.tiro);
    world.spawnHorda(3);world.msg('😱 O berrador gritou!','#ffd040');som(300,.6,'sawtooth',.2);shake(10);
  }
};
const _zd=Zumbi.prototype.desenhar;
Zumbi.prototype.desenhar=function(){
  _zd.call(this);if(!this.kind)return;
  const px=Math.round(this.x-cam.x),py=Math.round(this.y-cam.y);
  if(this.kind==='bm'){const p=.5+.5*Math.sin(Date.now()/180);
    g.fillStyle='rgba(120,210,70,'+(.22+.25*p)+')';g.beginPath();g.arc(px,py-14,20+4*p,0,7);g.fill();
    g.font='bold 14px Arial';g.textAlign='center';g.fillStyle='#d8ff90';g.fillText('☣',px,py-9);g.textAlign='left';}
  else{g.strokeStyle='#ffd040';g.lineWidth=2;g.beginPath();g.arc(px,py-32,16,0,7);g.stroke();}
};
function explodir(z){
  const j=world.j,R2=110;
  fx.sangue(z.x,z.y-10,30,'#8fd05a');fx.sangue(z.x,z.y-10,12);som(70,.5,'sawtooth',.25);shake(14);
  world.registrarRuido(z.x,z.y,BAL.ruido.tiro);
  const d=Math.hypot(j.x-z.x,j.y-z.y);
  if(d<R2&&!(j.inv_t>0)){j.vida-=25;world.msg('💥 Explosão tóxica! -25','#ff6060');}
  for(const o of world.zs){if(o===z)continue;const dd=Math.hypot(o.x-z.x,o.y-z.y);
    if(dd<R2){o.vida-=40;o.fl=6;if(o.st!=='chase'){o.st='alert';o.tx=z.x;o.ty=z.y;o.tmr=420;}}}
}
const _at=Mundo.prototype.atualizar;
Mundo.prototype.atualizar=function(){
  const mortos=this.zs.filter(z=>z.kind==='bm'&&z.vida<=0);
  if(lig){this.j.ruido=(this.j.ruido||0)+60;bat-=.0185;if(bat<=0){bat=0;lig=false;this.msg('Bateria acabou!','#ff9060');}}
  else bat=Math.min(100,bat+.01);
  const r=_at.call(this);
  mortos.forEach(explodir);
  return r;
};

/* RESPAWN + ONDAS + ESPECIAIS */
setInterval(()=>{
  if(!ok()||world.dlg||world.inv)return;
  const j=world.j,o=world.onda,max=Math.min(32,12+o*2);if(world.zs.length>=max)return;
  for(let k=0;k<20;k++){
    const a=Math.random()*6.283,r=600+Math.random()*300,x=j.x+Math.cos(a)*r,y=j.y+Math.sin(a)*r;
    if(x<80||y<80||x>MW*T-80||y>MH*T-80)continue;
    const tx=x/T|0,ty=y/T|0;if(mapa[ty][tx]>1&&mapa[ty][tx]!==5)continue;
    if(col(tx,ty)||casaDe(x,y))continue;
    const z=new Zumbi(x,y);
    z.vida=z.vidaMax=Math.round(z.vida*(1+o*.12));z.dano=Math.round(z.dano*(1+o*.08));
    const esp=world.zs.filter(q=>q.kind).length,rl=Math.random();
    if(o>=1&&esp<4){if(rl<.12)applyKind(z,'gr');else if(rl<.22)applyKind(z,'bm');}
    world.zs.push(z);break;
  }
},7000);

/* SAVE: especiais + corredores */
const _sc=salvarCheckpoint;
salvarCheckpoint=function(){
  _sc();
  try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(!s)return;
    s.kd=world.zs.filter(z=>z.kind).map(z=>({x:z.x,y:z.y,k:z.kind,g:z.gritou?1:0}));
    localStorage.setItem(SAVE_KEY,JSON.stringify(s));}catch(e){}
};
const _ap=aplicarSave;
aplicarSave=function(sv){
  const r=_ap(sv);
  if(r&&world){world.pegou=world.pegou||{};world.ruidoAcum=0;world.ruidoHist=[];world.hordaCd=0;world.ultimoTiro=0;
    for(const z of world.zs)if(z.vel>2&&!z.bruto){z.run=1;z.cor='#96a064';}
    for(const o of (sv.kd||[])){const z=world.zs.find(q=>q.x===o.x&&q.y===o.y&&!q.kind);if(z){applyKind(z,o.k,true);if(o.g)z.gritou=1;}}
    lig=false;bat=100;}
  return r;
};
const _nj=novoJogo;
novoJogo=function(){lig=false;bat=100;_nj();};

/* LANTERNA (desenho) */
const _no=noite;
noite=function(){
  _no();
  if(!lig||!world)return;
  const j=world.j,px=j.x-cam.x,py=j.y-cam.y-20,a=Math.atan2(j.dir[1],j.dir[0]);
  g.save();g.globalCompositeOperation='lighter';g.beginPath();g.moveTo(px,py);g.arc(px,py,330,a-.5,a+.5);g.closePath();g.clip();
  const gr=g.createRadialGradient(px,py,10,px,py,330);gr.addColorStop(0,'rgba(255,240,180,.38)');gr.addColorStop(1,'rgba(255,240,180,0)');
  g.fillStyle=gr;g.fillRect(px-340,py-340,680,680);g.restore();
};

/* HUD: setas, bateria, pausa */
const _hud=hud;
hud=function(){
  _hud();
  for(const z of world.zs){
    if(z.st!=='chase')continue;
    const sx=z.x-cam.x,sy=z.y-cam.y;if(sx>0&&sx<W&&sy>0&&sy<H)continue;
    if(Math.hypot(z.x-world.j.x,z.y-world.j.y)>800)continue;
    const a=Math.atan2(sy-H/2,sx-W/2),ex=Math.max(30,Math.min(W-30,W/2+Math.cos(a)*W)),ey=Math.max(30,Math.min(H-30,H/2+Math.sin(a)*H));
    g.save();g.translate(ex,ey);g.rotate(a);g.fillStyle=z.kind==='bm'?'rgba(140,230,80,.85)':'rgba(255,60,60,.8)';
    g.beginPath();g.moveTo(14,0);g.lineTo(-8,-9);g.lineTo(-8,9);g.fill();g.restore();
  }
  RR('#2a2a32',15,212,120,10,5);RR(lig?'#ffe9a8':'#8a8a70',15,212,120*bat/100,10,5);
  g.fillStyle='#fff';g.font='bold 11px Arial';g.fillText('🔦 F · '+Math.round(bat)+'%',142,221);
  if(estado==='pausa'){
    g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,W,H);g.textAlign='center';
    g.fillStyle='#ffe066';g.font='bold 56px Arial';g.fillText('PAUSADO',W/2,H/2);
    g.fillStyle='#ccc';g.font='18px Arial';g.fillText('P/⏸ continua · M som · F lanterna',W/2,H/2+40);
    g.fillStyle='#9fd070';g.fillText('☣ verde explode ao morrer · anel amarelo = berrador (chama horda)',W/2,H/2+72);g.textAlign='left';
  }
};

/* =========================================================
   INPUT BASE
   ========================================================= */
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if([' ','tab','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();
  keys[k]=true;ambiente();

  if(estado==='menu'){
    if(k==='arrowup'||k==='w'){menuSel=(menuSel-1+menuOpts.length)%menuOpts.length;if(menuSel===1&&!temSave)menuSel=0;}
    if(k==='arrowdown'||k==='s'){menuSel=(menuSel+1)%menuOpts.length;if(menuSel===1&&!temSave)menuSel=0;}
    if(k==='enter'||k===' '){
      if(menuSel===0)novoJogo();
      else if(menuSel===1&&temSave)continuarJogo();
    }
    return;
  }
  if(estado==='morte'){
    if(k==='arrowup'||k==='w'||k==='arrowdown'||k==='s'){menuSel=(menuSel+1)%2;}
    if(k==='enter'||k===' '){ if(menuSel===0)renascer(); else irMenu(); }
    return;
  }
  if(estado==='fim'){
    if(k==='r'||k==='enter'||k===' ')irMenu();
    return;
  }
  if(estado==='pausa'){
    if(k==='p')estado='jogando';
    return;
  }
  if(world.dlg&&(k===' '||k==='enter')){dlgAvancar();return;}
  if(estado==='jogando'){
    if(k==='escape'){
      world.inv=false;
      if(world.dlg){world.dlg=null;}
      else{irMenu();}
      return;
    }
    if(k==='i'||k==='tab')world.inv=!world.inv;
    if(/^[1-9]$/.test(k))teclaNum(+k);
    if(k==='e')interagir();
    if(k==='q'&&!world.dlg&&!world.inv){
      const J=world.j;
      let dx=0,dy=0;
      if(keys['w']||keys['arrowup'])dy--;if(keys['s']||keys['arrowdown'])dy++;
      if(keys['a']||keys['arrowleft'])dx--;if(keys['d']||keys['arrowright'])dx++;
      if(dx||dy)J.esquivar(dx,dy);
    }
  }
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

const pos=e=>{const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height;};
cv.addEventListener('mousemove',pos);
cv.addEventListener('contextmenu',e=>{e.preventDefault();return false;});
document.addEventListener('contextmenu',e=>{if(e.target===cv)e.preventDefault();});

cv.addEventListener('mousedown',e=>{
  pos(e);ambiente();
  if(estado==='menu'){
    const oy=H/2+40;
    menuOpts.forEach((opt,i)=>{
      const y=oy+i*70;
      if(mouse.x>W/2-180&&mouse.x<W/2+180&&mouse.y>y-28&&mouse.y<y+28){
        if(i===1&&!temSave)return;
        menuSel=i;
        if(i===0)novoJogo();else if(i===1)continuarJogo();
      }
    });
    return;
  }
  if(estado==='morte'){
    const oy=H/2+60;
    for(let i=0;i<2;i++){
      const y=oy+i*70;
      if(mouse.x>W/2-180&&mouse.x<W/2+180&&mouse.y>y-28&&mouse.y<y+28){
        menuSel=i;
        if(i===0)renascer();else irMenu();
        return;
      }
    }
    return;
  }
  if(estado==='fim'){irMenu();return;}
  if(estado==='pausa'){estado='jogando';return;}

  if(e.button===2){
    if(world.dlg||world.inv){mouse.rDown=false;return;}
    if(estado==='jogando')arremessarPedra();
    mouse.rDown=true;
    return;
  }
  if(world.dlg){dlgAvancar();mouse.down=false;return;}
  if(estado==='jogando'&&clicarUI())return;
  mouse.down=true;
});
addEventListener('mouseup',e=>{
  if(e.button===2)mouse.rDown=false;
  else mouse.down=false;
});
addEventListener('wheel',e=>{
  if(!world||world.dlg||world.inv||estado!=='jogando')return;
  const o=[0,1,2].filter(i=>i==0||(world.j.inv[HB[i]]||0)>0);
  const c=o.indexOf(HB.indexOf(world.j.arma));
  equipar(HB[o[(c+(e.deltaY>0?1:-1)+o.length)%o.length]]);
  e.preventDefault();
},{passive:false});

function loop(){
  if(estado==='menu'){telaMenu();requestAnimationFrame(loop);return;}
  if(estado==='morte'){telaMorte();requestAnimationFrame(loop);return;}
  if(estado==='fim'){fimTela();requestAnimationFrame(loop);return;}
  if(estado==='pausa'){
    g.fillStyle='#0d0f14';g.fillRect(0,0,W,H);
    g.save();shk();desenharMundo();fxDraw();noite();g.restore();
    beacon();hud();hotbar();minimapa();objetivos();
    if(world.inv)mochila();
    dialogo();
    requestAnimationFrame(loop);return;
  }

  if(estado==='jogando'&&!world.dlg){
    if(!world.inv){
      let dx=0,dy=0;
      if(keys['w']||keys['arrowup'])dy--;
      if(keys['s']||keys['arrowdown'])dy++;
      if(keys['a']||keys['arrowleft'])dx--;
      if(keys['d']||keys['arrowright'])dx++;
      const J=world.j,mv=dx||dy;
      if(J.stam==undefined)J.stam=100;
      const lento=keys['shift']&&!J.cans;
      const corre=keys['control']&&mv&&J.stam>0&&!J.cans;
      J.vel=lento?BAL.player.lento:corre?BAL.player.corre:BAL.player.vel;
      if(J.wind||J.cd>10)J.vel*=.45;
      if(corre){J.stam-=BAL.player.drenoStam;if(J.stam<=0){J.stam=0;J.cans=true;}}
      else{J.stam=Math.min(100,J.stam+(J.cd>0||J.wind?0:(mv?BAL.player.regenAndando:BAL.player.regenParado)));if(J.cans&&J.stam>25)J.cans=false;}
      const jCasa=casaDe(J.x,J.y);
      const mult=jCasa?BAL.ruido.casaFator:1;
      J.ruido=(!mv?(lento?BAL.ruido.lento:BAL.ruido.parado):lento?BAL.ruido.lento:corre?BAL.ruido.correndo:BAL.ruido.andando)*mult;
      if(J.cd>10)J.ruido=Math.max(J.ruido,(J.arma=='Pistola'?BAL.ruido.tiro:BAL.ruido.ataque)*mult);
      if(J.abrir)J.ruido=Math.max(J.ruido,BAL.ruido.vasculhar*mult);
      if(mv)world.registrarRuido(J.x,J.y,J.ruido*0.02);
      if(corre)world.registrarRuido(J.x,J.y,0.3);
      if(J.cur>0){
        if(mv){J.cur=0;world.msg('Curativo cancelado','#ff9060');}
        else{J.cur--;if(J.cur==0){J.inv['Bandagem']--;J.vida=Math.min(J.vidaMax,J.vida+45);
          fx.t.push({x:J.x,y:J.y-50,t:'+45',c:'#8fff8f',l:40});som(520,.2);}}
      }
      J.mover(dx,dy);
      if(mouse.down||keys[' '])world.j.atacar(world.zs);
      golpeTick();
    }
    const j=world.j;
    cam.x+=(j.x-W/2-cam.x)*.15;
    cam.y+=(j.y-H/2+CAM_OFF-cam.y)*.15;
    if(!world.inv){
      const r=world.atualizar();
      if(r==='gameover'){estado='morte';menuSel=0;}
    }
    questTick();audioTick();
    if(world.onda!==(world._on||0)){
      world._on=world.onda;
      const l=LORE.ondas[world.onda];
      if(l)falar(l);
    }
  }
  g.fillStyle='#0d0f14';g.fillRect(0,0,W,H);
  g.save();shk();desenharMundo();fxDraw();noite();g.restore();
  beacon();hud();hotbar();minimapa();objetivos();
  if(world.inv)mochila();
  dialogo();
  requestAnimationFrame(loop);
}
temSave=temSaveDisponivel();
loop();
</script>
